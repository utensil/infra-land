# herdr configuration — tmux-style keybindings
# Managed via just prep-herdr-tmux (symlinked from ~/projects/infra-land).
#
# Prefix is ctrl+b (herdr default == tmux default).
# Most defaults already match tmux: prefix+c new tab, prefix+p/n prev/next,
# prefix+x close pane, prefix+z zoom, prefix+h/j/k/l focus, prefix+1..9 tab switch,
# prefix+w workspace picker (~= tmux session picker).
# Hard limits in herdr 0.6.0 (no tmux equivalent possible):
#   - no `prefix → arrow` pane resize (only prefix+r toggles resize mode)
#   - no `prefix+[` scroll/copy mode (scrollback opens in $EDITOR via prefix+e)
#   - sessions are CLI-only (`herdr session attach <name>`), no in-UI picker

onboarding = false

[theme]
name = "gruvbox"

[ui.sound]
enabled = false

[ui.toast]
enabled = true

[keys]
# tmux-style splits
split_vertical = "prefix+|"
split_horizontal = "prefix+-"

# tmux-style detach / rename / close
detach = "prefix+d"
rename_tab = "prefix+,"
close_tab = "prefix+&"

# AGENT-NOTE: close_workspace kills the whole workspace (all panes/tabs, e.g.
# a `j lean` workspace); keep it away from detach (prefix+d) to avoid
# fat-fingering a kill. prefix+shift+q = ctrl+b then Q (Quit).
close_workspace = "prefix+shift+q"

[session]
# AGENT-NOTE: Resume pi (and other integrated agent) panes into their native
# conversation sessions after a herdr server restart. Requires the matching
# agent integration (herdr integration install pi) so panes report a native
# session reference; default is already true, kept explicit here.
resume_agents_on_restore = true
[experimental]
# Herdr Browser renders Chromium frames through the Kitty graphics protocol.
kitty_graphics = true

# Allow Paddy (and other CLI agents) to invoke herdr from inside a herdr pane
# for diagnostics. Without this, `herdr ...` fails with "nested herdr is
# disabled by default" and routed bots can't probe the live server.
allow_nested = true

[ui]
agent_panel_sort = "spaces"
