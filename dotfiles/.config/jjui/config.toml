# https://github.com/idursun/jjui/discussions/163

# Not working
# [[--scope]]
# "--when.commands" = ["diff", "show"]

# [--scope.ui]
# pager = "delta"
# diff-formatter = "delta"

[custom_commands]
"delta" = { key = ["d"], args = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """jj show -r $change_id --summary --git --color=always | delta --pager 'less -R'""",
], show = "interactive" }

"hunk" = { key = ["h"], args = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  """jj show -r $change_id --summary --git --color=always | hunk pager --pager --mode stack --wrap --hunk-headers""",
], show = "interactive" }

"ci" = {  key = ["c"], args = [
  "util",
  "exec",
  "--",
  "bash",
  "-c",
  "jj ci"
], show = "interactive" }
