name: blog-depot

# Build the freeze-free Julia depot for the ca-in-julia post on x86_64 (Spindle's arch),
# precompiled + GL-validated, and publish it as a GitHub-release asset. Spindle pulls the
# asset instead of building/precompiling the depot itself.
#
# First run after changing the Manifest: blog-depot-src is a fixed-output derivation whose
# per-arch hash isn't known yet (x86_64 starts as fakeHash). The "Lock FOD hash" step
# detects the mismatch, prints the real hash to the job summary, and STOPS green — copy it
# into nix/flake.nix (outputHash.x86_64-linux) and push again to build + release.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/blog-depot.yml'
      - 'nix/flake.nix'
      - 'nix/blog-depot/**'

jobs:
  build-depot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # create/upload the release
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # sandbox=false so the depot's stage-2 precompile can start Xvfb + use the
          # software-GL recipe (matches the validated local setup).
          extra-conf: |
            sandbox = false

      - name: Lock FOD hash (x86_64)
        id: fod
        working-directory: nix
        run: |
          set +e
          out="$(nix build .#blog-depot-src --no-link --print-out-paths 2>&1)"
          echo "$out"
          if echo "$out" | grep -q 'hash mismatch'; then
            got="$(echo "$out" | grep -oE 'got:[[:space:]]*sha256-[A-Za-z0-9+/=]+' | grep -oE 'sha256-[A-Za-z0-9+/=]+' | head -1)"
            {
              echo "## blog-depot-src x86_64 FOD hash"
              echo ''
              echo 'The x86_64 FOD hash is not yet locked. Put this in `nix/flake.nix`'
              echo '(`blogDepotSrcFor` → `outputHash."x86_64-linux"`) and push again:'
              echo ''
              echo '```'
              echo "$got"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "locked=false" >> "$GITHUB_OUTPUT"
            echo "::warning::x86_64 FOD hash = $got — fill nix/flake.nix and re-run"
            exit 0
          fi
          # Built cleanly → hash already correct.
          echo "locked=true" >> "$GITHUB_OUTPUT"

      - name: Build depot
        if: steps.fod.outputs.locked == 'true'
        working-directory: nix
        run: |
          depot="$(nix build .#blog-depot --no-link --print-out-paths)"
          echo "DEPOT_PATH=$depot" >> "$GITHUB_ENV"
          echo "depot: $depot"
          du -sh "$depot"

      - name: Validate render (x86_64, headless, against the built depot)
        if: steps.fod.outputs.locked == 'true'
        working-directory: nix
        run: |
          nix develop .#blog-render -c bash -c '
            set -e
            export DISPLAY=:73
            rm -f /tmp/.X73-lock /tmp/.X11-unix/X73 2>/dev/null || true
            Xvfb :73 -screen 0 1280x1024x24 +extension GLX +render -noreset >/tmp/xvfb.log 2>&1 &
            sleep 4
            mkdir -p /tmp/wdepot
            export JULIA_DEPOT_PATH="/tmp/wdepot:'"$DEPOT_PATH"'"
            export JULIA_PKG_OFFLINE=true
            cd blog-depot
            julia --project=. render.jl 2>&1 | tee /tmp/render.out
          '
          test -s /tmp/streamplot.mp4 && test -s /tmp/lorenz.mp4 || { echo "::error::mp4s not produced"; exit 1; }
          load="$(grep -oE 'load Grassmann\+GLMakie: [0-9.]+' /tmp/render.out | grep -oE '[0-9.]+' | head -1)"
          total="$(grep -oE 'TOTAL render: [0-9.]+' /tmp/render.out | grep -oE '[0-9.]+' | head -1)"
          echo "load=${load}s total=${total}s" | tee -a "$GITHUB_STEP_SUMMARY"
          # A fast load proves the store-depot .ji are valid (no recompile). A recompile
          # would push load to ~200s+ and defeat the cache → fail so we notice.
          awk -v l="${load:-999}" 'BEGIN { exit (l+0 > 90) }' \
            || { echo "::error::load ${load}s — depot recompiled (cache invalid at store path)"; exit 1; }
          echo "VALIDATE OK: rendered against the cached depot, no recompile (load ${load}s, total ${total}s)"

      - name: Package depot (tar.zst at its store path)
        if: steps.fod.outputs.locked == 'true'
        run: |
          base="$(basename "$DEPOT_PATH")"
          # Preserve the absolute /nix/store path so consumers can place the depot back
          # at the exact path its precompile caches (.ji) reference.
          tar -C /nix/store -cf - "$base" \
            | nix run nixpkgs#zstd -- -19 -T0 -o blog-depot-x86_64.tar.zst
          ls -lh blog-depot-x86_64.tar.zst
          echo "$DEPOT_PATH" > blog-depot-x86_64.storepath
          sha256sum blog-depot-x86_64.tar.zst | tee blog-depot-x86_64.sha256

      - name: Build + package render-env closure (julia + GL + Xvfb + env.sh)
        if: steps.fod.outputs.locked == 'true'
        working-directory: nix
        run: |
          env_out="$(nix build .#blog-render-env --no-link --print-out-paths)"
          echo "render-env: $env_out"
          # Export the closure (env_out + julia-official + mesa.drivers + libGL + X libs + …)
          # as a NAR so Spindle can `nix-store --import` and have every referenced path land
          # in /nix/store under the same names the env.sh hard-codes.
          nix-store --export $(nix-store -qR "$env_out") \
            | nix run nixpkgs#zstd -- -19 -T0 -o ../blog-render-env-x86_64.nar.zst
          cd ..
          ls -lh blog-render-env-x86_64.nar.zst
          echo "$env_out" > blog-render-env-x86_64.storepath
          sha256sum blog-render-env-x86_64.nar.zst | tee blog-render-env-x86_64.sha256

      - name: Publish to R2 (utensil-tngl bucket via aws-cli, multipart-safe)
        if: steps.fod.outputs.locked == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # aws-cli's S3 client handles multipart uploads automatically for files > 8 MiB
          # by default — bypasses wrangler's 300 MiB cap. R2's S3-compatible endpoint
          # uses Signature V4; AWS_DEFAULT_REGION=auto is the conventional R2 sentinel.
          assets=(
            blog-depot-x86_64.tar.zst
            blog-depot-x86_64.storepath
            blog-depot-x86_64.sha256
            blog-render-env-x86_64.nar.zst
            blog-render-env-x86_64.storepath
            blog-render-env-x86_64.sha256
          )
          for f in "${assets[@]}"; do
            echo "uploading $f → s3://$R2_BUCKET/$f"
            aws --endpoint-url "$R2_ENDPOINT" s3 cp "$f" "s3://$R2_BUCKET/$f"
          done
          echo "all uploaded; public URL base: ${{ secrets.R2_PUBLIC_URL }}"
