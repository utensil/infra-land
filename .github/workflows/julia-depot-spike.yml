name: julia-depot-spike

# Freeze-free blog feasibility. libquadmath is at ${julia}/lib/julia (x86_64).
# Pkg.precompile() WORKERS don't find it even when we export that dir. Diagnose:
# does a julia-spawned child inherit our exported LD_LIBRARY_PATH (is nix run /
# the wrapper resetting it)? Then precompile a single pkg (fast) with the env.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/julia-depot-spike.yml'

jobs:
  env-propagation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: utensil/blog
          path: blog
      - uses: DeterminateSystems/nix-installer-action@main
      - name: env propagation + single-pkg precompile
        run: |
          export JULIA_DEPOT_PATH="$PWD/depot"
          PROJ="$PWD/blog/content/posts/ca-in-julia"
          JL="github:NixOS/nixpkgs/cc6431d5598071f0021efc6c009c79e5b5fe1617#julia_110"

          echo "::group::instantiate" ; nix run "$JL" -- --project="$PROJ" -e 'using Pkg; Pkg.instantiate()' ; echo "::endgroup::"

          LIBJ=$(nix run "$JL" -- -e 'print(normpath(joinpath(Sys.BINDIR,"..","lib","julia")))')
          echo "lib/julia = $LIBJ"
          ls -l "$LIBJ/libquadmath.so.0" 2>&1

          export LD_LIBRARY_PATH="$LIBJ:${LD_LIBRARY_PATH:-}"
          echo "== exported LD_LIBRARY_PATH=$LD_LIBRARY_PATH =="
          echo "== does main + a julia-spawned child see it via nix run? =="
          nix run "$JL" -- -e 'println("MAIN_LLP=", get(ENV,"LD_LIBRARY_PATH","UNSET")); run(`bash -lc "echo CHILD_LLP=\$LD_LIBRARY_PATH"`)' 2>&1 | grep -E 'MAIN_LLP|CHILD_LLP'

          echo "::group::precompile SpecialFunctions (single, fast) with the env"
          nix run "$JL" -- --project="$PROJ" -e 'using Pkg; Pkg.precompile("SpecialFunctions")' 2>&1 | tail -10 && echo "PRECOMPILE_SF_OK" || echo "PRECOMPILE_SF_FAILED"
          echo "::endgroup::"
