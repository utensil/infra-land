name: julia-depot-spike

# libquadmath is at ${julia}/lib/julia (x86_64). `nix run` may sanitize the env,
# so precompile workers don't inherit our LD_LIBRARY_PATH. Test: realize julia,
# invoke the binary DIRECTLY with LD_LIBRARY_PATH=${julia}/lib/julia exported, so
# workers inherit it → does the failing SpecialFunctions precompile now succeed?
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/julia-depot-spike.yml'

jobs:
  direct-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: utensil/blog
          path: blog
      - uses: DeterminateSystems/nix-installer-action@main
      - name: direct julia binary + exported LD_LIBRARY_PATH
        run: |
          export JULIA_DEPOT_PATH="$PWD/depot"
          PROJ="$PWD/blog/content/posts/ca-in-julia"
          JL="github:NixOS/nixpkgs/cc6431d5598071f0021efc6c009c79e5b5fe1617#julia_110"
          JULIA=$(nix build --no-link --print-out-paths "$JL")
          echo "julia store path = $JULIA"
          export LD_LIBRARY_PATH="$JULIA/lib/julia:${LD_LIBRARY_PATH:-}"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"

          echo "== child inherits LLP? =="
          "$JULIA/bin/julia" -e 'println("MAIN=", get(ENV,"LD_LIBRARY_PATH","UNSET")); run(`bash -c "printf CHILD=; printf %s \"$LD_LIBRARY_PATH\"; echo"`)'

          echo "::group::instantiate" ; "$JULIA/bin/julia" --project="$PROJ" -e 'using Pkg; Pkg.instantiate()' ; echo "::endgroup::"
          echo "::group::precompile SpecialFunctions (direct binary + exported LLP)"
          if "$JULIA/bin/julia" --project="$PROJ" -e 'using Pkg; Pkg.precompile("SpecialFunctions")' 2>&1 | tail -10; then echo "SF_OK"; else echo "SF_FAILED"; fi
          echo "::endgroup::"
