name: julia-depot-spike

# Feasibility spike for a freeze-free blog. Current blocker: x86_64 OpenSpecFun_jll
# can't load libquadmath.so.0 (CompilerSupportLibraries_jll defers to system libs;
# nixpkgs cc6431d5/2024-05 gcc doesn't ship a findable libquadmath). A/B test:
# does the PINNED nixpkgs julia vs a RECENT nixpkgs julia load SpecialFunctions
# (the openspecfun→libquadmath chain) on x86_64?
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/julia-depot-spike.yml'

jobs:
  jll-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: utensil/blog
          path: blog
      - uses: DeterminateSystems/nix-installer-action@main
      - name: A) pinned julia_110 (cc6431d5) — using SpecialFunctions
        run: |
          PROJ="$PWD/blog/content/posts/ca-in-julia"
          JULIA_DEPOT_PATH="$PWD/da" nix run "github:NixOS/nixpkgs/cc6431d5598071f0021efc6c009c79e5b5fe1617#julia_110" -- \
            --project="$PROJ" -e 'using Pkg; Pkg.instantiate(); using SpecialFunctions; println("A: SF OK on pinned")' 2>&1 | tail -12 || echo "A: FAILED (pinned)"
      - name: B) recent nixpkgs julia_110 (nixos-24.11) — using SpecialFunctions
        if: always()
        run: |
          PROJ="$PWD/blog/content/posts/ca-in-julia"
          JULIA_DEPOT_PATH="$PWD/db" nix run "github:NixOS/nixpkgs/nixos-24.11#julia_110" -- \
            --project="$PROJ" -e 'using Pkg; Pkg.instantiate(); using SpecialFunctions; println("B: SF OK on recent")' 2>&1 | tail -12 || echo "B: FAILED (recent)"
