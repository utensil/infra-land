name: julia-depot-spike

# UNLOCK HYPOTHESIS: nixpkgs julia_110 can't do headless GL (No GLXFBConfigs), but
# the freeze worked because juliaup installs the OFFICIAL julia binary, whose GLFW
# uses the system Mesa libGL. Test: official julia 1.10.3 binary + GLMakie's xvfb
# recipe → does the full depot (incl. GLMakie) precompile headless? If yes, package
# the official binary in the flake (fetchurl + autopatchelf) → freeze-free is back.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/julia-depot-spike.yml'

jobs:
  official-julia:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: utensil/blog
          path: blog
      - name: GL deps (GLMakie CI set)
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev mesa-utils xvfb libgl1 freeglut3-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev xsettingsd x11-xserver-utils libgl1-mesa-dri
      - name: official julia 1.10.3 + full precompile (GLMakie, headless)
        run: |
          curl -fsSL https://julialang-s3.julialang.org/bin/linux/x64/1.10/julia-1.10.3-linux-x86_64.tar.gz | tar xz
          JULIA="$PWD/julia-1.10.3/bin/julia"
          $JULIA --version
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x1024x24 +extension GLX +render -noreset >/tmp/xvfb.log 2>&1 &
          sleep 3
          export LIBGL_ALWAYS_SOFTWARE=1
          export JULIA_DEPOT_PATH="$PWD/depot"
          PROJ="$PWD/blog/content/posts/ca-in-julia"
          echo "::group::instantiate" ; time "$JULIA" --project="$PROJ" -e 'using Pkg; Pkg.instantiate()' ; echo "::endgroup::"
          echo "::group::precompile (GLMakie, headless)" ; time "$JULIA" --project="$PROJ" -e 'using Pkg; Pkg.precompile()' ; echo "::endgroup::"
          echo "::group::load GLMakie" ; time "$JULIA" --project="$PROJ" -e 'using GLMakie; println("GLMakie OK")' ; echo "::endgroup::"
          echo "== depot size ==" ; du -sh "$JULIA_DEPOT_PATH"
