name: julia-depot-spike

# Freeze-free blog feasibility. Finding: `using X` works (main process) but
# Pkg.precompile() WORKERS don't inherit the julia wrapper's lib env → libquadmath
# not found. Fix: export CompilerSupportLibraries_jll's LIBPATH into LD_LIBRARY_PATH
# so workers inherit it. This spike locates libquadmath + tests that fix on the
# full precompile (GLMakie etc.) under xvfb, with timing + depot size.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/julia-depot-spike.yml'

jobs:
  worker-env-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: utensil/blog
          path: blog
      - uses: DeterminateSystems/nix-installer-action@main
      - name: headless GL deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa freeglut3-dev mesa-utils libgl1-mesa-dri xorg-dev
      - name: locate libquadmath + retry precompile with worker LD_LIBRARY_PATH
        run: |
          export JULIA_DEPOT_PATH="$PWD/depot"
          export LIBGL_ALWAYS_SOFTWARE=1
          PROJ="$PWD/blog/content/posts/ca-in-julia"
          JL="github:NixOS/nixpkgs/cc6431d5598071f0021efc6c009c79e5b5fe1617#julia_110"

          echo "::group::instantiate" ; nix run "$JL" -- --project="$PROJ" -e 'using Pkg; Pkg.instantiate()' ; echo "::endgroup::"

          echo "== where does the MAIN process get libquadmath? =="
          nix run "$JL" -- -e '
            using CompilerSupportLibraries_jll, Libdl
            println("ENV_LLP=", get(ENV,"LD_LIBRARY_PATH","<unset>"))
            println("CSL_LIBPATH=", CompilerSupportLibraries_jll.LIBPATH[])
            println("CSL_artifact=", CompilerSupportLibraries_jll.artifact_dir)
            println("dlpath=", try Libdl.dlpath("libquadmath.so.0") catch e; string(e) end)
          ' 2>&1 | tail -8

          CSLP=$(nix run "$JL" -- -e 'using CompilerSupportLibraries_jll; print(CompilerSupportLibraries_jll.LIBPATH[])' 2>/dev/null)
          export LD_LIBRARY_PATH="$CSLP:${LD_LIBRARY_PATH:-}"
          echo "== LD_LIBRARY_PATH for workers: $LD_LIBRARY_PATH =="

          echo "::group::precompile (worker env fix, GLMakie, xvfb)"
          time xvfb-run -a nix run "$JL" -- --project="$PROJ" -e 'using Pkg; Pkg.precompile()' 2>&1 | tail -18
          echo "::endgroup::"
          echo "::group::load GLMakie (cached?)" ; time xvfb-run -a nix run "$JL" -- --project="$PROJ" -e 'using GLMakie; println("GLMakie OK")' 2>&1 | tail -5 ; echo "::endgroup::"
          echo "== depot size ==" ; du -sh "$JULIA_DEPOT_PATH" 2>/dev/null
