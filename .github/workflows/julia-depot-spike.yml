name: julia-depot-spike

# Clean test: realize julia, export LD_LIBRARY_PATH=${julia}/lib/julia (where
# libquadmath.so.0 is), invoke the binary DIRECTLY, and precompile the failing
# SpecialFunctions. Does exporting that dir let the precompile WORKERS find
# libquadmath? (No fragile diagnostics this time.)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/julia-depot-spike.yml'

jobs:
  clean-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: utensil/blog
          path: blog
      - uses: DeterminateSystems/nix-installer-action@main
      - name: precompile SpecialFunctions with exported lib/julia
        run: |
          export JULIA_DEPOT_PATH="$PWD/depot"
          PROJ="$PWD/blog/content/posts/ca-in-julia"
          JL="github:NixOS/nixpkgs/cc6431d5598071f0021efc6c009c79e5b5fe1617#julia_110"
          JULIA=$(nix build --no-link --print-out-paths "$JL")
          export LD_LIBRARY_PATH="$JULIA/lib/julia${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          "$JULIA/bin/julia" --project="$PROJ" -e 'using Pkg; Pkg.instantiate()'
          echo "::group::precompile SpecialFunctions"
          if "$JULIA/bin/julia" --project="$PROJ" -e 'using Pkg; Pkg.precompile("SpecialFunctions")'; then
            echo "RESULT=SF_PRECOMPILE_OK"
          else
            echo "RESULT=SF_PRECOMPILE_FAILED"
          fi
          echo "::endgroup::"
