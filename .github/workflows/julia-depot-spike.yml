name: julia-depot-spike

# Feasibility spike for a freeze-free blog. libquadmath was a self-inflicted
# devShell issue — the WRAPPED julia (nix run, as a derivation would use it)
# resolves JLL libs. Now the real test: full instantiate + PRECOMPILE the
# ca-in-julia depot (GLMakie etc.) headless via the wrapped julia → does GLMakie
# precompile headless (Mesa+xvfb), how long, how big? Drives the two-stage nix
# depot derivation.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/julia-depot-spike.yml'

jobs:
  full-precompile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: utensil/blog
          path: blog
      - uses: DeterminateSystems/nix-installer-action@main
      - name: headless GL deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa freeglut3-dev mesa-utils libgl1-mesa-dri xorg-dev
      - name: instantiate + precompile + load GLMakie (wrapped julia, xvfb, timed)
        run: |
          export JULIA_DEPOT_PATH="$PWD/depot"
          export LIBGL_ALWAYS_SOFTWARE=1
          PROJ="$PWD/blog/content/posts/ca-in-julia"
          JL="github:NixOS/nixpkgs/cc6431d5598071f0021efc6c009c79e5b5fe1617#julia_110"
          echo "::group::instantiate" ; time xvfb-run -a nix run "$JL" -- --project="$PROJ" -e 'using Pkg; Pkg.instantiate()' ; echo "::endgroup::"
          echo "::group::precompile (GLMakie etc., headless)" ; time xvfb-run -a nix run "$JL" -- --project="$PROJ" -e 'using Pkg; Pkg.precompile()' ; echo "::endgroup::"
          echo "::group::load GLMakie (should be fast = cache works)" ; time xvfb-run -a nix run "$JL" -- --project="$PROJ" -e 'using GLMakie; println("GLMakie OK")' ; echo "::endgroup::"
          echo "== depot size ==" ; du -sh "$JULIA_DEPOT_PATH"
